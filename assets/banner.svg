<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGradient); }
    .grid-line { stroke: #1e293b; stroke-width: 0.7; stroke-opacity: 0.4; }
    
    /* Dynamic Animated Network Edges */
    .edge-flow {
      stroke-dasharray: 8, 12;
      animation: dashMove 14s linear infinite;
    }
    .edge-pulse {
      animation: pulseEdge 4s ease-in-out infinite alternate;
    }
    
    /* Dynamic Floating Nodes in Background */
    .node-float-1 { animation: floatAnim1 7s ease-in-out infinite alternate; }
    .node-float-2 { animation: floatAnim2 9s ease-in-out infinite alternate; }
    .node-float-3 { animation: floatAnim3 8s ease-in-out infinite alternate; }
    .node-pulse-ring { animation: ringScale 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* Badge Pills Animation */
    .pill-glow {
      animation: pillFade 5s ease-in-out infinite alternate;
    }

    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseEdge {
      0% { stroke-opacity: 0.25; stroke-width: 1.2; }
      100% { stroke-opacity: 0.75; stroke-width: 2.4; }
    }
    @keyframes floatAnim1 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-16px) translateX(8px); }
    }
    @keyframes floatAnim2 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(14px) translateX(-10px); }
    }
    @keyframes floatAnim3 {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-12px) translateX(-14px); }
    }
    @keyframes ringScale {
      0% { r: 12px; opacity: 0.9; }
      100% { r: 32px; opacity: 0; }
    }
    @keyframes pillFade {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="340" class="bg" rx="16" />

  <!-- Subtle Matrix Grid -->
  <g class="grid-layer">
    <line x1="0" y1="68" x2="1200" y2="68" class="grid-line" />
    <line x1="0" y1="136" x2="1200" y2="136" class="grid-line" />
    <line x1="0" y1="204" x2="1200" y2="204" class="grid-line" />
    <line x1="0" y1="272" x2="1200" y2="272" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="340" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="340" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="340" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="340" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="340" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="340" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="340" class="grid-line" />
  </g>

  <!-- Dynamic Animated Graph Layer (in background, opacity controlled to keep text in foreground crisp) -->
  <g class="graph-bg-network" opacity="0.45">
    <!-- Graph Edges / Paths -->
    <path d="M 80,60 Q 240,110 380,50 T 680,80 T 960,50 T 1140,100" fill="none" stroke="#6366f1" stroke-width="1.8" class="edge-flow edge-pulse" />
    <path d="M 120,280 Q 320,210 520,290 T 820,240 T 1080,270" fill="none" stroke="#06b6d4" stroke-width="1.8" class="edge-flow edge-pulse" />
    <line x1="160" y1="90" x2="120" y2="280" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.35" class="edge-flow" />
    <line x1="960" y1="50" x2="820" y2="240" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.35" class="edge-flow" />
    <line x1="1040" y1="170" x2="1140" y2="100" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="960" y1="50" x2="1040" y2="170" stroke="#06b6d4" stroke-width="1.4" class="edge-pulse" />

    <!-- Graph Nodes with Subtle Ambient Motion -->
    <g class="node-float-1">
      <circle cx="160" cy="90" r="14" fill="#6366f1" opacity="0.25" />
      <circle cx="160" cy="90" r="7" fill="#818cf8" filter="url(#softGlow)" />
      <circle cx="160" cy="90" class="node-pulse-ring" fill="none" stroke="#818cf8" stroke-width="1.5" />
    </g>

    <g class="node-float-2">
      <circle cx="960" cy="50" r="16" fill="#06b6d4" opacity="0.2" />
      <circle cx="960" cy="50" r="8" fill="#22d3ee" filter="url(#softGlow)" />
      <circle cx="960" cy="50" class="node-pulse-ring" fill="none" stroke="#22d3ee" stroke-width="1.5" />
    </g>

    <g class="node-float-3">
      <circle cx="1040" cy="170" r="18" fill="#8b5cf6" opacity="0.25" />
      <circle cx="1040" cy="170" r="9" fill="#a78bfa" filter="url(#softGlow)" />
    </g>

    <g class="node-float-1">
      <circle cx="820" cy="240" r="12" fill="#10b981" opacity="0.2" />
      <circle cx="820" cy="240" r="6" fill="#34d399" filter="url(#softGlow)" />
      <circle cx="820" cy="240" class="node-pulse-ring" fill="none" stroke="#34d399" stroke-width="1.5" />
    </g>

    <g class="node-float-2">
      <circle cx="120" cy="280" r="14" fill="#3b82f6" opacity="0.25" />
      <circle cx="120" cy="280" r="7" fill="#60a5fa" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- High-Contrast Foreground Content (Protected from Dynamic Clutter) -->
  <g id="foreground-content" transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)" class="pill-glow">
      <rect width="330" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="18" cy="16" r="4.5" fill="#22d3ee" filter="url(#softGlow)" />
      <text x="32" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">
        B2B GRAPH &amp; CRM INTELLIGENCE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="138" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
      Relationship Intelligence &amp; Mapping
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
      Curated Ecosystem of SaaS Platforms, Graph Data Systems &amp; Open-Source Warm Path Engines
    </text>

    <!-- Feature Pillars / Interactive Highlights -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#6366f1" />
        <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          🕸️ Network Graph Analytics
        </text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(225, 0)">
        <rect width="205" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#06b6d4" />
        <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          🔥 Warm Intro Pathfinding
        </text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(445, 0)">
        <rect width="200" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#10b981" />
        <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          ⚡ Automated CRM Sync
        </text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(660, 0)">
        <rect width="210" height="42" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#f59e0b" />
        <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
          🛡️ Enterprise Privacy &amp; OS
        </text>
      </g>
    </g>
  </g>
</svg>
